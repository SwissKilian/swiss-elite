version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      # Monatlich statt wöchentlich: jeder Dependabot-PR kostet einen CI-Lauf.
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      astro:
        patterns: ["astro", "@astrojs/*"]
      lint:
        patterns: ["eslint", "eslint-*", "@eslint/*", "typescript-eslint", "prettier", "globals"]
    ignore:
      # astro check unterstützt TypeScript 7 noch nicht (wie Nice Grips).
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
